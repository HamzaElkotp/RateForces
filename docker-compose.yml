services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rateforces
      POSTGRES_PASSWORD: rateforces
      POSTGRES_DB: rateforces
    ports:
      - "5432:5432"
    volumes:
      - rateforces-postgres:/var/lib/postgresql/data

  test-postgres:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rateforces_test
      POSTGRES_PASSWORD: rateforces_test
      POSTGRES_DB: rateforces_test
    ports:
      - "55432:5432"

volumes:
  rateforces-postgres:
