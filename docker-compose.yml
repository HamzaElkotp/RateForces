services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rateforces
      POSTGRES_PASSWORD: rateforces
      POSTGRES_DB: rateforces
    ports:
      - "5432:5432"
    volumes:
      - rateforces-postgres:/var/lib/postgresql/data

volumes:
  rateforces-postgres:
